kind = "web"
previewPath = "/"
title = "Q-Lab: AI Pentest Operations"
description = "A Bond-inspired, unofficial local SaaS workspace by Ajmal Shan for practicing AI application penetration testing against deterministic synthetic data and intentionally vulnerable workflows."
version = "1.0.0"
id = "artifacts/acme-desk"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20296

[services.development]
run = "pnpm --filter @workspace/acme-desk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/acme-desk", "run", "build" ]
serve = "static"
publicDir = "artifacts/acme-desk/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20296"
BASE_PATH = "/"
